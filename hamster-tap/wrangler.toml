# Конфигурация Cloudflare Workers для Hamster Tap.
# Локальная версия на Node.js (server.js) продолжает работать независимо от этого файла.
#
# Деплой: npx wrangler deploy            (прод)
#         npx wrangler deploy --env staging
# Локально: npx wrangler dev             (localhost:8787, локальная база D1)

name = "hamster-tap"
main = "cloudflare/src/worker.js"
# С этой датой node:crypto (createHmac) и прочий nodejs_compat включены по умолчанию.
compatibility_date = "2026-08-04"
workers_dev = true

# Статику (index.html, styles.css, app.js) отдаёт edge — воркер для неё не вызывается.
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true

[vars]
# Публичный адрес мини-аппа: на workers.dev он стабилен и известен заранее.
WEBAPP_URL = "https://hamster-tap.hamstercombat1.workers.dev"
BOT_USERNAME = "HamsterCombat1_bot"
# Реклама за энергию: сети перечисляются в AD_PROVIDERS по приоритету, ключ
# Chanify кладётся секретом CHANIFY_API_KEY (см. tools/cf-deploy.ps1), AD_MODE
# оставляем по умолчанию — live.
# Monetag: 11854383 — главная зона SDK из тега кабинета (одна на все форматы, она
# же обслуживает rewarded-ролик за энергию), адрес скрипта в кабинете указан как
# //libtl.com/sdk.js (протокол-относительный) — пишем https явно.
# Пассивная реклама Monetag (In-App Interstitial): «частота/окно_в_часах/интервал_с/
# задержка_с/сброс_при_перезагрузке» — до 2 показов за 6 минут, пауза 30 секунд,
# первый показ через 5 секунд. Награды не даёт: платят за CPM, постбеков у формата нет.
MONETAG_INAPP_SETTINGS = "2/0.1/30/5/0"
# Постбек-секрет Monetag кладётся секретом MONETAG_POSTBACK_SECRET (тоже
# ставит cf-deploy.ps1): адрес с ним вставляют в кабинете как Postback URL.
AD_PROVIDERS = "monetag,chanify"
MONETAG_ZONE = "11854383"
MONETAG_SDK_URL = "https://libtl.com/sdk.js"
# 1 — награду выдаём только после постбека сети (надёжнее, но требует, чтобы постбек
# был настроен в кабинете). По умолчанию 0: кредит по колбэку клиента, постбек пишем
# в базу для сверки. Вместе с «1» работает страховка MONETAG_POSTBACK_GRACE_MS.
MONETAG_REQUIRE_POSTBACK = "1"
MONETAG_POSTBACK_GRACE_MS = "20000"
# Оплата: внутри Telegram продаём за звёзды (правила платформы), рублёвые платежи
# идут на внешнюю страницу через ЮKassa. Пока канал не включён, PAYMENTS_PROVIDER
# остаётся "stars" — мини-апп работает как прежде.
# PAYMENTS_PROVIDER = "yookassa"
# PAY_PAGE_ORIGIN = "https://pay.example.com"     # домен внешней страницы (для CORS)
# PAY_PAGE_URL = "https://pay.example.com/pay.html"
# YOOKASSA_SHOP_ID = ""                            # публичный id магазина
# YOOKASSA_RETURN_URL = "https://pay.example.com/done.html"
# YOOKASSA_RECEIPTS = "1"                          # чеки от ЮKassa (54-ФЗ)
# Секреты (кладутся как секреты воркера): PAY_LINK_SECRET (подпись личных ссылок,
# пусто — берём BOT_TOKEN), YOOKASSA_SECRET_KEY, YOOKASSA_WEBHOOK_SECRET.
# AD_BOT_ADS=1 дополнительно включает рекламу после ответов бота.

# База D1. Идентификаторы подставляет tools/cf-deploy.ps1 после `wrangler d1 create`.
# В локальном режиме (`wrangler dev`) значения не важны — используется local SQLite.
[[d1_databases]]
binding = "DB"
database_name = "hamster-tap"
database_id = "26570402-f43f-4b89-b6a9-3d9b7ae0d613"

# Окружение для автотестов: своя база и разрешённый dev-вход, прод это не затрагивает.
[env.staging]
name = "hamster-tap-staging"

[env.staging.vars]
WEBAPP_URL = "https://hamster-tap-staging.example.workers.dev"
BOT_USERNAME = "HamsterCombat1_bot"
ALLOW_DEV = "1"
# В автотестах реклама не должна рассылаться по-настоящему: показ считается успешным,
# сеть не дёргается.
AD_MODE = "stub"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "hamster-tap-staging"
database_id = "local-placeholder"

# Расписание напоминаний: раз в 20 минут. Запуски идут в общий суточный лимит
# запросов бесплатного тарифа — для сотни игроков это доли процента.
# Дубликатов нет: push_log не даёт отправить одно напоминание дважды в день.
# В staging расписание выключено: там нет BOT_TOKEN и своя пустая база.
[triggers]
crons = ["*/20 * * * *"]

[env.staging.triggers]
crons = []
